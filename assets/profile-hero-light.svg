<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">박성호 / pk42ac GitHub profile hero banner</title>
  <desc id="desc">Animated premium GitHub profile banner for AI security and AgentOps builder 박성호.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"><animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#06B6D4"><animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#10B981"><animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="ascii" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"><animate attributeName="offset" values="0;0.25;0" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#06B6D4"><animate attributeName="offset" values="0.45;0.75;0.45" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="20%" r="50%"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.25"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2" cx="82%" cy="16%" r="45%"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.20"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow3" cx="70%" cy="92%" r="45%"><stop offset="0" stop-color="#10B981" stop-opacity="0.17"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <filter id="noise" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.028"/></feComponentTransfer></filter>
    <clipPath id="clip"><rect x="20" y="20" width="1140" height="570" rx="34"/></clipPath>
  </defs>

  <rect x="20" y="20" width="1140" height="570" rx="34" fill="url(#bg)"/>
  <g clip-path="url(#clip)">
    <circle cx="250" cy="96" r="260" fill="url(#glow1)"><animate attributeName="cx" values="230;285;230" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="930" cy="78" r="250" fill="url(#glow2)"><animate attributeName="cy" values="64;128;64" dur="13s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="565" r="260" fill="url(#glow3)"><animate attributeName="r" values="220;290;220" dur="10s" repeatCount="indefinite"/></circle>
    <rect x="20" y="20" width="1140" height="570" filter="url(#noise)" opacity="0.55"/>
    <g opacity="0.48">
      <circle cx="140" cy="118" r="2" fill="#2563EB"><animate attributeName="cy" values="118;100;118" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1025" cy="156" r="2.4" fill="#06B6D4"><animate attributeName="cy" values="156;132;156" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="374" cy="504" r="2" fill="#10B981"><animate attributeName="cy" values="504;474;504" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="735" cy="120" r="1.8" fill="#2563EB"><animate attributeName="cx" values="735;758;735" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1110" cy="438" r="2" fill="#10B981"><animate attributeName="cy" values="438;404;438" dur="5.5s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="21" y="21" width="1138" height="568" rx="34" fill="none" stroke="url(#accent)" stroke-width="1.3" opacity="0.74">
      <animate attributeName="stroke-opacity" values="0.34;0.82;0.34" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="80" y="72" width="362" height="466" rx="28" fill="#F8FAFC" fill-opacity="0.82" stroke="rgba(15,23,42,.08)" filter="url(#shadow)"/>
    <rect x="492" y="72" width="604" height="466" rx="28" fill="#FFFFFF" fill-opacity="0.82" stroke="rgba(15,23,42,.08)" filter="url(#shadow)"/>
    <path d="M92 86 C170 58, 304 58, 426 92" stroke="#0F172A" stroke-opacity="0.08" stroke-width="2" fill="none"/>
    <path d="M510 86 C680 54, 900 54, 1080 98" stroke="#0F172A" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  </g>

  <g transform="translate(124 126)" filter="url(#softGlow)">
    <animateTransform attributeName="transform" type="translate" values="124 126;124 116;124 126" dur="6s" repeatCount="indefinite"/>
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="url(#ascii)" letter-spacing="1.1">
      <tspan x="0" y="0" opacity="0">      .-''''-.<animate attributeName="opacity" values="0;1;1" begin="0.1s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="28" opacity="0">    .'  .--.  '.<animate attributeName="opacity" values="0;1;1" begin="0.3s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="56" opacity="0">   /   /    \   \<animate attributeName="opacity" values="0;1;1" begin="0.5s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="84" opacity="0">  |   |  ()  |   |<animate attributeName="opacity" values="0;1;1" begin="0.7s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="112" opacity="0">  |   | .--. |   |<animate attributeName="opacity" values="0;1;1" begin="0.9s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="140" opacity="0">   \   \____/   /<animate attributeName="opacity" values="0;1;1" begin="1.1s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="168" opacity="0">    '.  ----  .'<animate attributeName="opacity" values="0;1;1" begin="1.3s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="196" opacity="0">      '-.__.-'<animate attributeName="opacity" values="0;1;1" begin="1.5s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="244" opacity="0">   pk42ac@agentops<animate attributeName="opacity" values="0;1;1" begin="1.9s" dur="0.7s" fill="freeze"/></tspan>
      <tspan x="0" y="276" opacity="0">   █<animate attributeName="opacity" values="0;1;0;1" begin="2.3s" dur="1s" repeatCount="indefinite"/></tspan>
    </text>
  </g>

  <g transform="translate(532 112)">
    <circle cx="0" cy="0" r="6" fill="#F87171"/><circle cx="22" cy="0" r="6" fill="#F59E0B"/><circle cx="44" cy="0" r="6" fill="#10B981"/>
    <text x="0" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#475569">Hi 👋</text>
    <text x="0" y="94" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#0F172A">I'm 박성호</text>
    <text x="0" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="url(#accent)">
      <tspan>AI Security &amp; AgentOps Builder</tspan><tspan fill="#06B6D4">_</tspan>
      <animate attributeName="opacity" values="0.72;1;0.72" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#334155">
      <text x="0" y="182" opacity="0">▸ Location       Republic of Korea<animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.5s" fill="freeze"/></text>
      <text x="0" y="212" opacity="0">▸ Role           AI허브팀 박성호 연구원<animate attributeName="opacity" values="0;1" begin="1.3s" dur="0.5s" fill="freeze"/></text>
      <text x="0" y="242" opacity="0">▸ Current Focus  AgentOps · MCP · AI DLP<animate attributeName="opacity" values="0;1" begin="1.6s" dur="0.5s" fill="freeze"/></text>
      <text x="0" y="272" opacity="0">▸ Portfolio      github.com/Sungho-pk42ac<animate attributeName="opacity" values="0;1" begin="1.9s" dur="0.5s" fill="freeze"/></text>
    </g>
    <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="700">
      <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.2s" dur="0.5s" fill="freeze"/>
        <rect x="0" y="314" width="91" height="34" rx="17" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.28"/><text x="18" y="336" fill="#1D4ED8">TypeScript</text>
        <rect x="104" y="314" width="74" height="34" rx="17" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.30"/><text x="123" y="336" fill="#0E7490">Python</text>
        <rect x="191" y="314" width="68" height="34" rx="17" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.32"/><text x="211" y="336" fill="#047857">MCP</text>
        <rect x="272" y="314" width="86" height="34" rx="17" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.28"/><text x="292" y="336" fill="#1D4ED8">SARIF</text>
        <rect x="371" y="314" width="84" height="34" rx="17" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.30"/><text x="390" y="336" fill="#0E7490">FastAPI</text>
        <rect x="0" y="362" width="94" height="34" rx="17" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.32"/><text x="18" y="384" fill="#047857">AgentOps</text>
        <rect x="108" y="362" width="96" height="34" rx="17" fill="#FFFFFF" stroke="#2563EB" stroke-opacity="0.28"/><text x="126" y="384" fill="#1D4ED8">LLM Eval</text>
        <rect x="218" y="362" width="75" height="34" rx="17" fill="#FFFFFF" stroke="#06B6D4" stroke-opacity="0.30"/><text x="239" y="384" fill="#0E7490">Docker</text>
        <rect x="307" y="362" width="64" height="34" rx="17" fill="#FFFFFF" stroke="#10B981" stroke-opacity="0.32"/><text x="328" y="384" fill="#047857">Git</text>
      </g>
    </g>
    <g transform="translate(0 438)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#475569" opacity="0.92">
      <text x="0" y="0">github · security · open-source · Korean AI workflows</text>
      <rect x="0" y="14" width="512" height="1" fill="url(#accent)" opacity="0.50"><animate attributeName="width" values="0;512;512" dur="3.8s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <rect x="20" y="60" width="1140" height="2" fill="#0F172A" opacity="0.05"><animate attributeName="y" values="60;570;60" dur="7.5s" repeatCount="indefinite"/></rect>
  <rect x="20" y="20" width="1140" height="570" rx="34" fill="none" stroke="#0F172A" stroke-opacity="0.08"/>
</svg>
