name: Charts and cards

on:
  schedule:
    # daily at 04:07 KST (GitHub cron is UTC)
    - cron: "7 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/radar.py"
      - "scripts/cards.py"
      - ".github/workflows/radar.yml"

permissions:
  contents: write

concurrency:
  group: profile-main-assets
  cancel-in-progress: false

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Language radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py \
            --github "${{ github.repository_owner }}" \
            -o assets/radar-langs \
            --limit 7 --values --curve 0.4 \
            --exclude "html,css,shell,makefile,dockerfile,batchfile,procfile"

      - name: GitHub stat card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cards.py \
            --user "${{ github.repository_owner }}" \
            --out assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/radar-langs-*.svg assets/card-stats-*.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh charts and cards"
            git pull --rebase
            git push
          fi
