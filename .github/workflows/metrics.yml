name: 3D Contribution Calendar

on:
  schedule:
    # daily at 03:17 KST (GitHub cron is UTC)
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-main-assets
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Public contribution data works with the repository-scoped token, so no
      # personal access token or additional repository secret is required.
      - name: Generate 3D contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@9e3f937195cf840d364388973f73e3c4b3753586
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh 3D contribution calendar"
            git pull --rebase
            git push
          fi
